plugins {
    id 'com.android.application'
}

android {
    namespace 'com.majdi.tv.ambient'
    compileSdk 34

    defaultConfig {
        applicationId 'com.majdi.tv.ambient'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        majdi {
            storeFile file(System.getenv('MAJDI_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig System.getenv('MAJDI_KEYSTORE') ? signingConfigs.majdi : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
